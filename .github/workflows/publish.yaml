name: publish package

on:
  push:
    tags:
      - "v*.*.*"
      - "*.*.*"
    paths-ignore:
      - .github/**

jobs:
  publish:
    name: publish package
    uses: strg-at/github-workflows/.github/workflows/npm-publish.yaml@2c2ab5cac48aa7c90d103cd6552ca5ef013cad81 # v2.4.0
    with:
      runner: '["ubuntu-latest"]'
