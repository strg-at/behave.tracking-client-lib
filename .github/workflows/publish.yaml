---
name: publish package

on:
  push:
    tags:
      - "v*.*.*"
      - "*.*.*"
    paths-ignore:
      - .github/**

jobs:
  publish:
    name: publish package
    uses: strg-at/github-workflows/.github/workflows/npm-publish.yaml@948a59ecdf5297443483028e7c627d1afca14d7d # v2.3.0
    with:
      runner: '["ubuntu-latest"]'
